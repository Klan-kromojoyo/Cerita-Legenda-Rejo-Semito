<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legenda REJO SEMITO</title>

<style>

/* APP */
#app{opacity:0;transition:1s}
#app.show{opacity:1}

/* SILSILAH */
.tree{
    text-align:center;
    margin:40px;
}

.person{
    display:inline-block;
    padding:12px 20px;
    margin:10px;
    border:2px solid #c9a96e;
    border-radius:30px;
    cursor:pointer;
    transition:.3s;
    animation:fadeUp .6s ease forwards;
    opacity:0;
}
.person:hover {
            background: #f9e6c3;
            color: #1e1a17;
            box-shadow: 0 0 20px #f9e6c3;
        }
/* 🌌 GLOBAL ATMOSPHERE */
body {
    margin: 0;
    font-family: "Georgia", serif;
    background: radial-gradient(circle at center, #2c1e14 0%, #120d0a 100%);
    color: #f4e4bc;
    overflow-x: hidden;
}
html, body {
    width: 100%;
    overflow-x: hidden;
}

/* ✨ EFEK KABUT HALUS */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.03), transparent 70%);
    animation: fogMove 60s linear infinite;
    z-index: 0;
}

@keyframes fogMove {
    from { transform: translate(0,0); }
    to { transform: translate(-200px,-200px); }
}
#mediaContainer img,
#mediaContainer video {
    width: 100%;
    max-width: 100%;
    display: block;
}
/* 🎬 INTRO FULLSCREEN */
#intro {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
        url('https://raw.githubusercontent.com/nguantukbanget84-sys/silsilah-audio/refs/heads/main/Cover.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    text-align: center;
}

/* ✨ EFEK KABUT */
#intro::after {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
    animation: fog 40s linear infinite;
}

@keyframes fog {
    from { transform: translate(0,0); }
    to { transform: translate(-200px,-200px); }
}

/* 🎞️ JUDUL */
.title {
    font-size: 34px;
    letter-spacing: 6px;
    opacity: 0;
    animation: fadeUp 3s forwards;
    z-index: 2;
}

.subtitle {
    margin-top: 10px;
    opacity: 0;
    animation: fadeUp 3s 1s forwards;
    z-index: 2;
}

/* ▶️ TOMBOL MASUK */
.enter-btn {
    margin-top: 40px;
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    background: linear-gradient(#c9a96e,#a8894f);
    color: black;
    border-radius: 40px;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 3s 2s forwards;
    transition: 0.3s;
    z-index: 2;
}

.enter-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #c9a96e;
}

/* 🎬 ANIMASI */
@keyframes fadeUp {
    0% { opacity: 0; transform: translateY(40px);}
    100% { opacity: 1; transform: translateY(0);}
}

/* 🌑 FADE OUT */
.fade-out {
    animation: fadeOut 1.5s forwards;
}

@keyframes fadeOut {
    to {
        opacity: 0;
        visibility: hidden;
    }
}

/* 📖 HALAMAN UTAMA */
#app {
    opacity: 0;
    transition: 1.5s;
}

#app.show {
    opacity: 1;
}

/* 🖼️ GAMBAR KOMIK */
.comic-container img {
    width: 100%;
    animation: fadeImg 1s;
}

@keyframes fadeImg {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* 🎬 HEADER CINEMATIC */
header {
    height: 260px;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
        url('https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/Header%20komik.jpg');
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    border-bottom: 3px solid #c9a96e;
    box-shadow: 0 10px 40px rgba(0,0,0,0.9);
}

/* 🧭 TOMBOL EPISODE */
.episodes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
    max-width: 500px;
    margin: auto;
}

/* 🪨 DASAR BATU */
.episodes button {
    position: relative;
    padding: 18px;
    border-radius: 14px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;

    color: #f4e4bc;

    /* tekstur batu */
    background:
        linear-gradient(145deg, #2b2118, #120d0a);

    border: 2px solid #3a2c1f;

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,0.05),
        inset 0 -5px 10px rgba(0,0,0,0.8),
        0 5px 15px rgba(0,0,0,0.9);

    transition: all 0.3s ease;
    overflow: hidden;
}

/* ✨ UKIRAN EMAS */
.episodes button::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;

    background:
        linear-gradient(120deg,
            rgba(255,215,120,0.15),
            rgba(255,255,255,0.05),
            rgba(255,215,120,0.15)
        );

    mix-blend-mode: screen;
    opacity: 0.4;
    pointer-events: none;
}

/* 🌟 GARIS UKIRAN HALUS */
.episodes button::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;

    box-shadow:
        inset 0 0 15px rgba(201,169,110,0.4),
        inset 0 0 3px rgba(255,255,255,0.2);

    pointer-events: none;
}

/* 🔥 HOVER (emas menyala) */
.episodes button:hover {
    transform: translateY(-4px) scale(1.03);

    border: 2px solid #c9a96e;

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,0.1),
        inset 0 -5px 10px rgba(0,0,0,0.8),
        0 0 20px rgba(201,169,110,0.6),
        0 8px 20px rgba(0,0,0,0.9);

    color: #fff3d0;
}

/* 💥 KLIK */
.episodes button:active {
    transform: scale(0.96);

    box-shadow:
        inset 0 5px 10px rgba(0,0,0,0.9),
        inset 0 -2px 5px rgba(255,255,255,0.05);
}

/* 🌟 AKTIF (dipilih) */
.episodes button.active {
    border: 2px solid #ffd27a;

    box-shadow:
        inset 0 0 10px rgba(255,215,120,0.6),
        0 0 25px rgba(201,169,110,0.8);

    color: #fff5cc;
}
/* 🖼️ CONTAINER KOMIK */
.comic-container {
    max-width: 820px;
    margin: 20px auto;
    border: 10px solid #1e1a17;
    outline: 2px solid #c9a96e;
    background: #000;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    z-index: 2;
}

/* 🎬 EFEK FADE IMAGE */
.comic-container img {
    width: 100%;
    display: block;
    opacity: 0;
    animation: fadeIn 1s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* 📜 NARASI KERTAS TUA */
.narration {
    max-width: 760px;
    margin: 25px auto;
    padding: 25px;
    text-align: center;
    font-size: 1.2rem;
    font-style: italic;
    background: linear-gradient(#f4e4bc, #e6d3a3);
    color: #3b2b1f;
    border-left: 8px solid #c9a96e;
    box-shadow: 5px 5px 20px rgba(0,0,0,0.6);
    border-radius: 5px;
    position: relative;
    z-index: 2;
}

/* ✨ NARASI BERCAHAYA HALUS */
.narration::after {
    content: "";
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 20px rgba(255,255,255,0.2);
    pointer-events: none;
}

/* ⬅️➡️ NAVIGASI */
.nav-arrows {
    text-align: center;
    margin: 30px;
    z-index: 2;
    position: relative;
}

.nav-arrows button {
    background: none;
    border: 2px solid #c9a96e;
    color: #c9a96e;
    padding: 12px 25px;
    margin: 0 10px;
    cursor: pointer;
    font-size: 18px;
    border-radius: 30px;
    transition: 0.3s;
}

.nav-arrows button:hover {
    background: rgba(201,169,110,0.2);
    transform: scale(1.1);
}

.person:hover{
    background:#c9a96e;
    color:#000;
    transform:scale(1.1);
}

@keyframes fadeUp{
    from{opacity:0;transform:translateY(30px)}
    to{opacity:1;transform:translateY(0)}
}

/* POPUP */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: #1e1a17;
    color: #f9e6c3;
    padding: 25px;
    border-radius: 15px;
    border: 2px solid #c9a96e;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    z-index: 1000;
    max-width: 320px;
    width: 80%;
    text-align: center;

    opacity: 0;
    pointer-events: none;
    transition: 0.3s;
}

.popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
}
.popup button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;

    background: #7CFC00; /* hijau muda */
    color: #000;

    box-shadow: 0 0 10px #7CFC00;
    transition: 0.3s;
}

.popup button:hover {
    background: #aaff33;
    box-shadow: 0 0 20px #7CFC00;
    transform: scale(1.1);
}

@keyframes pop{
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

button{cursor:pointer}
/* 🎧 TOMBOL AUDIO */
.audio-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: linear-gradient(#c9a96e, #a8894f);
    color: #000;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 50px;
    font-weight: bold;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    z-index: 999;
    transition: 0.3s;
}

.audio-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #c9a96e;
}

/* ▶️ TOMBOL MULAI (COVER) */
.start-btn {
    display: block;
    margin: 20px auto;
    padding: 14px 30px;
    font-size: 18px;
    background: linear-gradient(#c9a96e, #a8894f);
    border: none;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.3s;
}

.start-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 20px #c9a96e;
}

/* 🌙 RESPONSIVE */
@media(max-width:600px){
    header {
        height: 180px;
    }

    .narration {
        font-size: 1rem;
    }

    .episodes button {
        padding: 8px 15px;
        font-size: 12px;
    }
}
#mediaContainer video {
    width: 100%;
    border-radius: 8px;
    background: #000;
}


</style>
</head>

<body>

<!-- 🎬 INTRO -->
<div id="intro">
    <div class="title">LEGENDA</div>
    <div class="title">REJO SEMITO</div>
    <div class="subtitle">Sebuah kisah yang tak lekang oleh waktu...</div>
    <button class="enter-btn" onclick="enterStory()">
        ▶ Masuk ke Cerita
    </button>
</div>
<header></header>

<div class="episodes" id="epBtns"></div>

<div id="mediaContainer">
    <img id="comicImage" src="https://raw.githubusercontent.com/nguantukbanget84-sys/silsilah-audio/refs/heads/main/Cover.jpg">
</div>
<div style="text-align:center; margin:20px;">
  
</div>
<div class="narration" id="storyText">
   atau Ketuk ▶ untuk memulai cerita...
</div>

<div class="nav-arrows">
    <button onclick="prevEp()">◀</button>
    <button onclick="nextEp()">▶</button>
</div>
<!-- APP -->
<div id="app">

<div class="tree">
        <h2>SILSILAH KELUARGA</h2>
    <div class="person" onclick="showInfo('REJO SEMITO: Sang leluhur utama yang penuh perjuangan dan memiliki kekuatan .')">REJO SEMITO</div>
    <div class="person" onclick="showInfo('ANAK PERTAMA: Sosok pemberani yang mewarisi ketegasan sang ayah.')">GINEM</div>
    <div class="person" onclick="showInfo('ANAK KEDUA: Seorang penengah yang bijaksana dan sangat mencintai kedamaian.')">GIYEM</div>
    <div class="person" onclick="showInfo('ANAK KETIGA: Penjaga rahasia keluarga yang hidupnya penuh kemisteriusan.')">NARTI</div>
    <div class="person" onclick="showInfo('Satu-satunya anak lelaki, hidup tanpa pernah merasakan belaian kasih sayang ibu.')">SLAMET</div>
</div>

<div class="popup" id="popup">
    <div id="popupText"></div>
    <br>
    <button onclick="closePopup()">Tutup</button>
</div>

</div>
<audio id="music" loop>
<source src="https://github.com/nguantukbanget84-sys/AYAM-ENAK/raw/refs/heads/main/Merinding%20Dengar%20Ini!%20Inilah%20Misteri%20Alunan%20Musik%20Kuno%20lagu%20kerajaan%20majapah.mp3">
</audio>

<div class="audio-btn" onclick="toggleMusic()">🔊</div>

<script>

const text = document.getElementById("storyText");
const music = document.getElementById("music");
const popup = document.getElementById("popup");
const pText = document.getElementById("popupText");

let currentEp = 0;

// 🔥 DATA EPISODE (TAMBAH DI SINI SAJA)
const episodes = {
    1: { type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/silsilah-audio/refs/heads/main/Cerita%20pendek.png",
        text: "Kisah ini di tulis langsung oleh narasumber"
    },
    2: {
      type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/silsilah-audio/refs/heads/main/Komik%20REJO%20SEMITO.jpg",
        text: "Masa muda penuh cobaan..."
    },
    3: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/1.png",
        text: "Warisan keluarga mulai terbentuk, sebuah amanah besar untuk menjaga kerukunan anak cucu di masa depan."
    },
    4: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/2.png",
        text: "Episode baru dimulai di sini..."
    },
    5: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/3.png",
        text: "Perjuangan Mbah REJO"
    },
    6: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/4.png",
        text: "Saat melewati alas ngawi"
    },
    7: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/5.png",
        text: "begitu tiba di tujuan.."
    },
    8: {
        type: "video", src: "https://github.com/nguantukbanget84-sys/silsilah-audio/raw/refs/heads/main/Ilustrasi%20suasana.mp4",
        text: "ilustrasi suasana saat itu"
    },
    9: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/6.png",
        text: "Di sambut oleh Ayahnya (mbah Putih)"
    },
    10: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/7.png",
        text: "Menyampaikan tujuanya jauh-jauh dari Ceplukan ke ngawi..."
    },
    11: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/8.png",
        text: "Berpamitan.."
    },
    12: {
        type: "image", src: "https://raw.githubusercontent.com/nguantukbanget84-sys/KOMIK/refs/heads/main/9.png",
        text: "Bercerita sejenak.."
    }
};

// 🔥 AUTO BUAT TOMBOL
const epContainer = document.getElementById("epBtns");


for(let i in episodes){
    const btn = document.createElement("button");
    btn.innerText = "Bagian " + i;
    btn.id = "btn"+i;
    btn.onclick = () => loadEpisode(Number(i));
    epContainer.appendChild(btn);
}
function startStory(){
    loadEpisode(1);
}
// 🔥 LOAD EPISODE
function loadEpisode(ep){
    if(!episodes[ep]) return;

    currentEp = ep;

    const container = document.getElementById("mediaContainer");
    container.innerHTML = "";

    let media;

    if(episodes[ep].type === "image"){
        media = document.createElement("img");
        media.src = episodes[ep].src;
    }

    if(episodes[ep].type === "video"){
    media = document.createElement("video");
    media.src = episodes[ep].src;
    media.controls = true;
    media.autoplay = true;
    media.muted = true; // Tambahkan ini agar autoplay diizinkan browser
    media.setAttribute('playsinline', ''); // Penting untuk pengguna iPhone/iOS
    
    // Mencoba memutar manual setelah elemen masuk ke DOM
    setTimeout(() => {
        media.play().catch(error => {
            console.log("Autoplay diblokir, pengguna harus klik play manual.");
        });
    }, 100);
}


    media.style.width = "100%";
    container.appendChild(media);

    text.innerText = episodes[ep].text;

    for(let i in episodes){
        const b = document.getElementById("btn"+i);
        if(b) b.classList.remove("active");
    }

    const active = document.getElementById("btn"+ep);
    if(active) active.classList.add("active");
}

// 🔥 NEXT / PREV
function nextEp(){
    const max = Object.keys(episodes).length;
    if(currentEp < max){
        loadEpisode(currentEp + 1);
    }
}

function prevEp(){
    if(currentEp > 1){
        loadEpisode(currentEp - 1);
    }
}
function enterStory(){
    const intro = document.getElementById("intro");
    const app = document.getElementById("app");
    const music = document.getElementById("music");

    // fade keluar intro
    intro.classList.add("fade-out");

    // tampilkan halaman utama
    setTimeout(()=>{
        app.classList.add("show");
    }, 800);

    // 🎵 AUTO PLAY (AMAN, karena dari klik user)
    music.volume = 0;
    music.play();

    // fade in suara
    let vol = 0;
    const fade = setInterval(()=>{
        if(vol < 1){
            vol += 0.05;
            music.volume = vol;
        } else {
            clearInterval(fade);
        }
    }, 200);
}

function showInfo(text){
    const popup=document.getElementById('popup');
    document.getElementById('popupText').innerText=text;
    popup.classList.add('show');
}

function closePopup(){
    document.getElementById('popup').classList.remove('show');
}
</script>
</div>
</body>
</html>
